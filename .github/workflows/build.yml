name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile (targets macOS 12)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Compile (debug)
        run: swift build -v
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"

      - name: Assemble AirIsland.app
        run: ./build.sh app

      - name: Verify the binary really targets macOS 12
        run: |
          file AirIsland.app/Contents/MacOS/AirIsland
          otool -l AirIsland.app/Contents/MacOS/AirIsland \
            | grep -A4 LC_BUILD_VERSION \
            | grep minos

      - name: Verify the bundle and ad-hoc signature
        run: |
          test -x AirIsland.app/Contents/MacOS/AirIsland
          plutil -lint AirIsland.app/Contents/Info.plist
          codesign --verify --verbose AirIsland.app
          echo "Bundle OK: $(du -sh AirIsland.app | cut -f1)"

      - name: Upload the built app (downloadable artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AirIsland-app
          path: AirIsland.app
          if-no-files-found: error
